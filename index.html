<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خریدو فروش گپ و چنل و اکانت فری  فایر اسپارو</title>

  <!-- پیکربندی مشترک و واسطه Vercel -->
  <script src="./config.js"></script>

  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --text: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding-bottom: 30px; }
    
    header {
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title { font-weight: bold; font-size: 15px; }
    .header-left, .header-right { display: flex; align-items: center; gap: 8px; }
    
    .icon-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; font-size: 11px; text-align: center;
      border: none; font-weight: bold; padding: 2px;
    }
    .btn-group { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .sub-btn {
      background: #e0e0e0; border: none; padding: 3px 8px;
      border-radius: 10px; font-size: 11px; cursor: pointer;
    }
    .dots-btn { font-size: 22px; background: transparent; color: #333; border: none; cursor: pointer; padding: 5px; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
    }
    .product-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-card img {
      width: 100%; aspect-ratio: 1/1; object-fit: cover;
      border-radius: 8px; margin-bottom: 8px;
    }
    .product-title { font-size: 13px; font-weight: bold; margin-bottom: 5px; }
    .product-price { font-size: 12px; color: #27ae60; font-weight: bold; }

    .modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center; z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #fff; width: 88%; max-width: 380px;
      border-radius: 12px; padding: 18px; text-align: center;
      max-height: 85vh; overflow-y: auto; position: relative;
    }
    .modal-content h3 { margin-bottom: 15px; font-size: 15px; }
    .modal-content input {
      width: 100%; padding: 10px; margin: 6px 0;
      border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
    }
    .modal-btn {
      width: 100%; padding: 10px; margin-top: 8px;
      background: var(--primary); color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .close-btn { background: #e74c3c; margin-top: 5px; }
    
    .slider-container {
      display: flex; overflow-x: auto; gap: 8px;
      margin: 10px 0; padding-bottom: 5px;
    }
    .slider-container img {
      width: 80px; height: 80px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
    }
    
    .notif-item {
      background: #f8f9fa; border-right: 3px solid var(--primary);
      padding: 8px; margin: 6px 0; text-align: right; font-size: 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-right">
      <button class="dots-btn" onclick="openModal('adminAuthModal')">⋮</button>
    </div>
    
    <div class="header-title">خریدو فروش گپ و چنل و اکانت فری  فایر اسپارو</div>

    <div class="header-left">
      <div class="icon-btn" id="userCircle" onclick="handleUserCircleClick()">ورود/ثبت‌نام</div>
      <div class="btn-group">
        <div class="icon-btn" onclick="openNotifs()">🔔</div>
        <button class="sub-btn" onclick="goToSupport()">پشتیبانی</button>
      </div>
    </div>
  </header>

  <div class="products-grid" id="productsGrid"></div>

  <!-- پاپ‌آ‌پ انتخاب ورود یا ثبت نام -->
  <div class="modal" id="authChoiceModal">
    <div class="modal-content">
      <h3>ورود یا ثبت نام</h3>
      <button class="modal-btn" onclick="closeModal('authChoiceModal'); openModal('loginModal')">ورود (با رمز عبور)</button>
      <button class="modal-btn" style="background:#27ae60;" onclick="closeModal('authChoiceModal'); openModal('registerModal')">ثبت نام (اعضای جدید)</button>
      <button class="modal-btn close-btn" onclick="closeModal('authChoiceModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ ثبت نام -->
  <div class="modal" id="registerModal">
    <div class="modal-content">
      <h3>ثبت نام جدید</h3>
      <input type="text" id="regName" placeholder="نام (حداکثر ۶ حرف)" maxlength="6">
      <input type="text" id="regUser" placeholder="نام کاربری (حداقل ۵ حرف)">
      <input type="password" id="regPass" placeholder="رمز عبور (حداقل ۵ حرف)">
      <button class="modal-btn" id="regBtn" onclick="handleRegister()">ثبت نام</button>
      <button class="modal-btn close-btn" onclick="closeModal('registerModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ ورود کاربر -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h3>ورود به حساب</h3>
      <input type="text" id="loginUser" placeholder="نام کاربری">
      <input type="password" id="loginPass" placeholder="رمز عبور">
      <button class="modal-btn" id="loginBtn" onclick="handleLogin()">ورود</button>
      <button class="modal-btn close-btn" onclick="closeModal('loginModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ اطلاعات حساب -->
  <div class="modal" id="userInfoModal">
    <div class="modal-content">
      <h3>اطلاعات حساب</h3>
      <p id="userInfoText" style="margin: 10px 0; font-size: 13px; line-height: 1.6;"></p>
      <button class="modal-btn close-btn" onclick="handleLogout()">خروج از حساب</button>
      <button class="modal-btn" style="background:#7f8c8d;" onclick="closeModal('userInfoModal')">انصراف</button>
    </div>
  </div>

  <!-- پاپ‌آپ ورود مدیریت -->
  <div class="modal" id="adminAuthModal">
    <div class="modal-content">
      <h3>ورود مدیریت</h3>
      <input type="text" id="adminUser" placeholder="نام کاربری مدیر">
      <input type="password" id="adminPass" placeholder="رمز عبور مدیر">
      <button class="modal-btn" id="adminBtn" onclick="handleAdminLogin()">ورود به پنل</button>
      <button class="modal-btn close-btn" onclick="closeModal('adminAuthModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ اعلانات -->
  <div class="modal" id="notifModal">
    <div class="modal-content">
      <h3>اعلانات شما</h3>
      <div id="notifList"></div>
      <button class="modal-btn close-btn" onclick="closeModal('notifModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ جزئیات محصول -->
  <div class="modal" id="productDetailsModal">
    <div class="modal-content">
      <h3 id="pDetailsTitle"></h3>
      <img id="pDetailsImg" src="" style="width:100%; max-height:180px; object-fit:cover; border-radius:8px;">
      <p id="pDetailsPrice" style="color:#27ae60; font-weight:bold; margin:8px 0;"></p>
      <p id="pDetailsDesc" style="font-size:12px; text-align:right; margin-bottom:8px;"></p>
      
      <div class="slider-container" id="pDetailsExtraImgs"></div>
      
      <button class="modal-btn" style="background:#27ae60;" onclick="openBuyModal()">خرید محصول</button>
      <button class="modal-btn close-btn" onclick="closeModal('productDetailsModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ خرید -->
  <div class="modal" id="buyModal">
    <div class="modal-content">
      <h3>اطلاعات پرداخت</h3>
      <div style="font-size:12px; text-align:right; line-height: 1.8;">
        <p>شماره کارت: <b id="buyCardNum"></b></p>
        <p>نام صاحب کارت: <b id="buyCardName"></b></p>
        <p>آیدی روبیکا: <b id="buyRubika"></b></p>
      </div>
      <button class="modal-btn" onclick="goToSupportWithReceipt()">ارسال رسید از طریق سایت</button>
      <button class="modal-btn close-btn" onclick="closeModal('buyModal')">بستن</button>
    </div>
  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('user')) || null;
    let selectedProduct = null;

    window.onload = function() {
      updateUserUI();
      loadProducts();
      preventBackOnSession();
    };

    function preventBackOnSession() {
      history.pushState(null, null, location.href);
      window.onpopstate = function () { history.go(1); };
    }

    function openModal(id) { 
      const modal = document.getElementById(id);
      if(modal) modal.classList.add('active'); 
    }
    
    function closeModal(id) { 
      const modal = document.getElementById(id);
      if(modal) modal.classList.remove('active'); 
    }

    function updateUserUI() {
      const circle = document.getElementById('userCircle');
      if (currentUser) {
        circle.innerText = currentUser.name;
      } else {
        circle.innerText = "ورود/ثبت‌نام";
      }
    }

    function handleUserCircleClick() {
      if (currentUser) {
        document.getElementById('userInfoText').innerText = `نام کاربری: ${currentUser.username}\nرمز عبور: ${currentUser.password}`;
        openModal('userInfoModal');
      } else {
        openModal('authChoiceModal');
      }
    }

    // ثبت نام کاربر جدید از طریق API Vercel
    async function handleRegister() {
      const name = document.getElementById('regName').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value.trim();
      const btn = document.getElementById('regBtn');

      if (name.length === 0 || name.length > 6) return alert("نام باید حداکثر ۶ حرف باشد.");
      if (username.length < 5) return alert("نام کاربری باید حداقل ۵ حرف باشد.");
      if (password.length < 5) return alert("رمز عبور باید حداقل ۵ حرف باشد.");

      btn.innerText = "در حال بررسی...";
      btn.disabled = true;

      const existingUser = await DB.get(`users/${username}`);
      if (existingUser) {
        btn.innerText = "ثبت نام";
        btn.disabled = false;
        return alert("این نام کاربری از قبل وجود دارد.");
      }

      const userData = { name, username, password };
      await DB.set(`users/${username}`, userData);

      currentUser = userData;
      localStorage.setItem('user', JSON.stringify(userData));
      updateUserUI();
      closeModal('registerModal');
      btn.innerText = "ثبت نام";
      btn.disabled = false;
      alert("ثبت نام با موفقیت انجام شد.");
    }

    // ورود کاربر از طریق API Vercel
    async function handleLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      const btn = document.getElementById('loginBtn');

      if(!username || !password) return alert("نام کاربری و رمز عبور را وارد کنید.");

      btn.innerText = "در حال بررسی...";
      btn.disabled = true;

      const userData = await DB.get(`users/${username}`);
      btn.innerText = "ورود";
      btn.disabled = false;

      if (userData && userData.password === password) {
        currentUser = userData;
        localStorage.setItem('user', JSON.stringify(currentUser));
        updateUserUI();
        closeModal('loginModal');
        alert("ورود با موفقیت انجام شد.");
      } else {
        alert("نام کاربری یا رمز عبور اشتباه است.");
      }
    }

    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('user');
      updateUserUI();
      closeModal('userInfoModal');
    }

    // ورود مدیر از طریق API Vercel
    async function handleAdminLogin() {
      const u = document.getElementById('adminUser').value.trim();
      const p = document.getElementById('adminPass').value.trim();
      const btn = document.getElementById('adminBtn');

      btn.innerText = "در حال بررسی...";
      btn.disabled = true;

      let adminData = await DB.get('admin');
      btn.innerText = "ورود به پنل";
      btn.disabled = false;

      if (!adminData) {
        adminData = { username: "admin", password: "admin" };
      }

      if (u === adminData.username && p === adminData.password) {
        localStorage.setItem('adminAuth', 'true');
        window.location.href = 'modiree.html';
      } else {
        alert("اطلاعات مدیر اشتباه است.");
      }
    }

    // اعلانات
    async function openNotifs() {
      if (!currentUser) {
        alert("لطفاً ابتدا ثبت‌نام کنید یا وارد شوید.");
        openModal('authChoiceModal');
        return;
      }
      const list = document.getElementById('notifList');
      list.innerHTML = "در حال دریافت اعلانات...";
      openModal('notifModal');

      const notifs = await DB.get('notifications');
      list.innerHTML = "";

      if (notifs) {
        Object.keys(notifs).forEach(key => {
          const n = notifs[key];
          if (n.type === 'public' || (n.type === 'personal' && n.targetUser === currentUser.username)) {
            const div = document.createElement('div');
            div.className = 'notif-item';
            div.innerText = n.text;
            list.appendChild(div);
          }
        });
      }
      
      if (!list.innerHTML) list.innerHTML = "اعلانی وجود ندارد.";
    }

    function goToSupport() {
      if (!currentUser) {
        alert("لطفاً ابتدا ثبت‌نام کنید یا وارد شوید.");
        openModal('authChoiceModal');
        return;
      }
      window.location.href = 'posht.html';
    }

    function goToSupportWithReceipt() {
      window.location.href = 'posht.html?ref=receipt';
    }

    // بارگذاری لیست محصولات
    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = "در حال بارگذاری محصولات...";
      
      const products = await DB.get('products');
      grid.innerHTML = "";

      if (products) {
        Object.keys(products).forEach(key => {
          const p = products[key];
          p.id = key;
          const card = document.createElement('div');
          card.className = 'product-card';
          card.onclick = () => showProductDetails(p);
          card.innerHTML = `
            <img src="${p.mainImg}">
            <div class="product-title">${p.title || 'محصول'}</div>
            <div class="product-price">${p.price} تومان</div>
          `;
          grid.appendChild(card);
        });
      } else {
        grid.innerHTML = "<p style='grid-column: span 2; text-align:center;'>محصولی موجود نیست.</p>";
      }
    }

    function showProductDetails(p) {
      selectedProduct = p;
      document.getElementById('pDetailsTitle').innerText = p.title || 'جزئیات محصول';
      document.getElementById('pDetailsImg').src = p.mainImg;
      document.getElementById('pDetailsPrice').innerText = `قیمت: ${p.price} تومان`;
      document.getElementById('pDetailsDesc').innerText = p.desc || '';
      
      const extraContainer = document.getElementById('pDetailsExtraImgs');
      extraContainer.innerHTML = "";
      if (p.extraImgs && Array.isArray(p.extraImgs)) {
        p.extraImgs.forEach(url => {
          const img = document.createElement('img');
          img.src = url;
          extraContainer.appendChild(img);
        });
      }
      openModal('productDetailsModal');
    }

    function openBuyModal() {
      if (!selectedProduct) return;
      closeModal('productDetailsModal');
      document.getElementById('buyCardNum').innerText = selectedProduct.cardNum || '-';
      document.getElementById('buyCardName').innerText = selectedProduct.cardName || '-';
      document.getElementById('buyRubika').innerText = selectedProduct.rubika || '-';
      openModal('buyModal');
    }
  </script>
</body>
</html>
