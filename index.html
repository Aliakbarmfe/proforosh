<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات همه کاره</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- تنظیمات فایربیس و ImgBB -->
    <script src="./API/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding-bottom: 30px;
        }

        header {
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            flex-grow: 1;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #3498db;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            padding: 2px;
            overflow: hidden;
            word-break: break-word;
        }

        .btn-small {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }

        .menu-dots {
            font-size: 22px;
            cursor: pointer;
            padding: 0 6px;
            color: #555;
            user-select: none;
        }

        .left-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 12px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .product-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background-color: #eee;
        }

        .product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .product-title {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-price {
            font-size: 12px;
            color: #e74c3c;
            font-weight: bold;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: #666;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .fake-pass {
            -webkit-text-security: disc !important;
            font-family: text-security-disc, sans-serif !important;
        }

        .btn-block {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-danger { background: #e74c3c; }

        .btn-close {
            position: absolute;
            top: 12px;
            left: 12px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #888;
        }

        .slider-container {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 12px;
            scroll-snap-type: x mandatory;
            padding-bottom: 6px;
        }

        .slider-container img {
            width: 100%;
            max-width: 280px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            scroll-snap-align: center;
            flex-shrink: 0;
        }

        .notification-item {
            background: #f8f9fa;
            border-right: 4px solid #3498db;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .notification-item.personal {
            border-right-color: #e67e22;
        }

        .notification-date {
            font-size: 10px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-section">
            <span class="menu-dots" onclick="openAdminModal()">⋮</span>
        </div>

        <div class="header-title">
            💎 خدمات همه کاره 💎
        </div>

        <div class="header-section">
            <div id="userBtn" class="icon-circle" onclick="handleUserClick()">ورود/ثبت نام</div>
            <div class="left-controls">
                <button class="icon-circle" onclick="openNotifications()">🔔</button>
                <button class="btn-small" onclick="goToSupport()">پشتیبانی</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="product-grid" id="productGrid">
            <p style="grid-column: span 2; text-align: center; color: #777;">در حال بارگذاری محصولات...</p>
        </div>
    </div>

    <!-- پاپ آپ‌ها -->
    <div class="modal-overlay" id="authChoiceModal">
        <div class="modal-box">
            <button class="btn-close" onclick="closeModal('authChoiceModal')">✕</button>
            <div class="modal-title">ورود به حساب یا ثبت نام</div>
            <button class="btn-block" onclick="showLoginModal()">ورود (با رمز عبور)</button>
            <button class="btn-block" style="background:#2ecc71;" onclick="showRegisterModal()">ثبت نام (اعضای جدید)</button>
        </div>
    </div>

    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <button class="btn-close" onclick="closeModal('registerModal')">✕</button>
            <div class="modal-title">ثبت نام جدید</div>
            <div class="form-group">
                <label>نام (حداکثر ۶ حرف)</label>
                <input type="text" id="regName" class="form-control" maxlength="6" autocomplete="off">
            </div>
            <div class="form-group">
                <label>نام کاربری (حداقل ۵ حرف)</label>
                <input type="text" id="regUser" class="form-control" autocomplete="off">
            </div>
            <div class="form-group">
                <label>رمز عبور (حداقل ۵ حرف)</label>
                <input type="text" id="regPass" class="form-control fake-pass" autocomplete="off" spellcheck="false">
            </div>
            <button class="btn-block" onclick="processRegister()">ثبت نام</button>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <button class="btn-close" onclick="closeModal('loginModal')">✕</button>
            <div class="modal-title">ورود به حساب</div>
            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" id="loginUser" class="form-control" autocomplete="off">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="text" id="loginPass" class="form-control fake-pass" autocomplete="off" spellcheck="false">
            </div>
            <button class="btn-block" onclick="processLogin()">ورود</button>
        </div>
    </div>

    <div class="modal-overlay" id="accountModal">
        <div class="modal-box">
            <button class="btn-close" onclick="closeModal('accountModal')">✕</button>
            <div class="modal-title">اطلاعات کاربری</div>
            <p style="margin-bottom: 8px;"><strong>نام کاربری:</strong> <span id="accUser"></span></p>
            <p style="margin-bottom: 16px;"><strong>رمز عبور:</strong> <span id="accPass"></span></p>
            <button class="btn-block btn-danger" onclick="logout()">خروج از حساب</button>
        </div>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-box">
            <button class="btn-close" onclick="closeModal('adminModal')">✕</button>
            <div class="modal-title">ورود مدیریت</div>
            <div class="form-group">
                <label>نام کاربری مدیر</label>
                <input type="text" id="adminUser" class="form-control" autocomplete="off">
            </div>
            <div class="form-group">
                <label>رمز عبور مدیر</label>
                <input type="text" id="adminPass" class="form-control fake-pass" autocomplete="off" spellcheck="false">
            </div>
            <button class="btn-block" onclick="processAdminLogin()">ورود به پنل</button>
        </div>
    </div>

    <div class="modal-overlay" id="notifModal">
        <div class="modal-box">
            <button class="btn-close" onclick="closeModal('notifModal')">✕</button>
            <div class="modal-title">اعلان‌ها</div>
            <div id="notifList">در حال دریافت اعلانات...</div>
        </div>
    </div>

    <div class="modal-overlay" id="productDetailModal">
        <div class="modal-box">
            <button class="btn-close" onclick="closeModal('productDetailModal')">✕</button>
            <div id="productDetailContent"></div>
        </div>
    </div>

    <div class="modal-overlay" id="buyModal">
        <div class="modal-box">
            <button class="btn-close" onclick="closeModal('buyModal')">✕</button>
            <div class="modal-title">اطلاعات پرداخت</div>
            <div id="buyDetails"></div>
            <button class="btn-block" style="background:#2ecc71; margin-top:15px;" onclick="redirectToSupportWithReceipt()">ارسال رسید از طریق سایت</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let selectedProduct = null;

        window.onload = function() {
            checkAuthStatus();
            loadProducts();
        };

        function checkAuthStatus() {
            const savedUser = localStorage.getItem('proforosh_user');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    document.getElementById('userBtn').innerText = currentUser.name;
                } catch (e) {
                    currentUser = null;
                }
            } else {
                currentUser = null;
                document.getElementById('userBtn').innerText = "ورود/ثبت نام";
            }
        }

        function handleUserClick() {
            if (currentUser) {
                document.getElementById('accUser').innerText = currentUser.username;
                document.getElementById('accPass').innerText = currentUser.password;
                openModal('accountModal');
            } else {
                openModal('authChoiceModal');
            }
        }

        function showRegisterModal() {
            closeModal('authChoiceModal');
            openModal('registerModal');
        }

        function showLoginModal() {
            closeModal('authChoiceModal');
            openModal('loginModal');
        }

        function processRegister() {
            const name = document.getElementById('regName').value.trim();
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value.trim();

            if (name.length === 0 || name.length > 6) {
                alert('نام باید بین ۱ تا ۶ حرف باشد.');
                return;
            }
            if (user.length < 5) {
                alert('نام کاربری باید حداقل ۵ حرف باشد.');
                return;
            }
            if (pass.length < 5) {
                alert('رمز عبور باید حداقل ۵ حرف باشد.');
                return;
            }

            db.ref('users/' + user).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    alert('این نام کاربری قبلاً ثبت شده است.');
                } else {
                    const userData = { name: name, username: user, password: pass };
                    db.ref('users/' + user).set(userData).then(() => {
                        alert('ثبت‌نام با موفقیت انجام شد!');
                        localStorage.setItem('proforosh_user', JSON.stringify(userData));
                        checkAuthStatus();
                        closeModal('registerModal');
                    }).catch(err => {
                        alert('خطا در ثبت اطلاعات.');
                    });
                }
            }).catch(err => {
                alert('خطا در ارتباط با پایگاه داده.');
            });
        }

        function processLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if (!user || !pass) {
                alert('لطفاً همه فیلدها را پر کنید.');
                return;
            }

            db.ref('users/' + user).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    if (userData.password === pass) {
                        alert('ورود با موفقیت انجام شد!');
                        localStorage.setItem('proforosh_user', JSON.stringify(userData));
                        checkAuthStatus();
                        closeModal('loginModal');
                    } else {
                        alert('رمز عبور اشتباه است.');
                    }
                } else {
                    alert('نام کاربری یافت نشد.');
                }
            }).catch(err => {
                alert('خطا در ارتباط با پایگاه داده.');
            });
        }

        function logout() {
            localStorage.removeItem('proforosh_user');
            checkAuthStatus();
            closeModal('accountModal');
            alert('از حساب کاربری خارج شدید.');
        }

        function openAdminModal() {
            openModal('adminModal');
        }

        function processAdminLogin() {
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();

            db.ref('adminInfo').once('value').then(snapshot => {
                let adminData = snapshot.val();
                if (!adminData) {
                    adminData = { user: 'admin', pass: '1234' };
                }

                if (user === adminData.user && pass === adminData.pass) {
                    localStorage.setItem('proforosh_admin_logged', 'true');
                    window.location.href = 'modiree.html';
                } else {
                    alert('نام کاربری یا رمز عبور مدیر اشتباه است.');
                }
            }).catch(err => {
                alert('خطا در بررسی اطلاعات مدیر.');
            });
        }

        function loadProducts() {
            db.ref('products').on('value', snapshot => {
                const grid = document.getElementById('productGrid');
                grid.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #777;">هیچ محصولی یافت نشد.</p>';
                    return;
                }

                Object.keys(data).forEach(id => {
                    const p = data[id];
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.onclick = () => openProductDetail(p);
                    card.innerHTML = `
                        <img src="${p.mainImage}" alt="${p.title}">
                        <div class="product-info">
                            <div class="product-title">${p.title || 'محصول'}</div>
                            <div class="product-price">${p.price} تومان</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }, error => {
                document.getElementById('productGrid').innerHTML = '<p style="grid-column: span 2; text-align: center; color: #e74c3c;">خطا در دریافت محصولات از پایگاه داده.</p>';
            });
        }

        function openProductDetail(p) {
            selectedProduct = p;
            const content = document.getElementById('productDetailContent');
            
            let extraImagesHTML = `<div class="slider-container"><img src="${p.mainImage}"></div>`;
            if (p.extraImages && p.extraImages.length > 0) {
                extraImagesHTML = `<div class="slider-container">
                    <img src="${p.mainImage}">
                    ${p.extraImages.map(img => `<img src="${img}">`).join('')}
                </div>`;
            }

            content.innerHTML = `
                ${extraImagesHTML}
                <h3 style="margin-bottom:8px;">${p.title || 'محصول'}</h3>
                <p style="color:#e74c3c; font-weight:bold; margin-bottom:10px;">قیمت: ${p.price} تومان</p>
                <p style="font-size:13px; color:#555; margin-bottom:15px; white-space:pre-line;">${p.description || 'توضیحاتی ندارد.'}</p>
                <button class="btn-block" style="background:#2ecc71;" onclick="openBuyModal()">خرید محصول</button>
            `;
            openModal('productDetailModal');
        }

        function openBuyModal() {
            closeModal('productDetailModal');
            const details = document.getElementById('buyDetails');
            details.innerHTML = `
                <p style="margin-bottom:8px;"><strong>شماره کارت:</strong> ${selectedProduct.cardNumber || '-'}</p>
                <p style="margin-bottom:8px;"><strong>نام صاحب کارت:</strong> ${selectedProduct.cardName || '-'}</p>
                <p style="margin-bottom:8px;"><strong>آیدی روبیکا:</strong> ${selectedProduct.rubikaId || '-'}</p>
            `;
            openModal('buyModal');
        }

        function redirectToSupportWithReceipt() {
            if (!currentUser) {
                alert('برای ارسال رسید ابتدا باید ثبت نام کنید یا وارد حساب خود شوید.');
                closeModal('buyModal');
                openModal('authChoiceModal');
                return;
            }
            window.location.href = 'posht.html';
        }

        function openNotifications() {
            if (!currentUser) {
                alert('برای مشاهده اعلانات ابتدا باید ثبت نام کنید یا وارد حساب شوید.');
                openModal('authChoiceModal');
                return;
            }

            const notifList = document.getElementById('notifList');
            notifList.innerHTML = 'در حال دریافت...';
            openModal('notifModal');

            db.ref('notifications').once('value').then(snapshot => {
                notifList.innerHTML = '';
                const data = snapshot.val();
                let hasNotif = false;

                if (data) {
                    Object.keys(data).forEach(k => {
                        const item = data[k];
                        if (item.type === 'public' || (item.type === 'personal' && item.targetUser === currentUser.username)) {
                            hasNotif = true;
                            const div = document.createElement('div');
                            div.className = `notification-item ${item.type === 'personal' ? 'personal' : ''}`;
                            div.innerHTML = `
                                <div><strong>${item.type === 'public' ? '📢 اعلان عمومی' : '🔒 اعلان شخصی'}</strong></div>
                                <div style="margin-top:4px;">${item.message}</div>
                                <div class="notification-date">${item.date || ''}</div>
                            `;
                            notifList.appendChild(div);
                        }
                    });
                }

                if (!hasNotif) {
                    notifList.innerHTML = '<p style="text-align:center; color:#777;">هیچ اعلانی یافت نشد.</p>';
                }
            });
        }

        function goToSupport() {
            if (!currentUser) {
                alert('برای ارسال پیام به مدیر ابتدا ثبت نام کنید یا وارد شوید.');
                openModal('authChoiceModal');
                return;
            }
            window.location.href = 'posht.html';
        }

        function openModal(id) {
            const el = document.getElementById(id);
            if(el) el.classList.add('active');
        }
        function closeModal(id) {
            const el = document.getElementById(id);
            if(el) el.classList.remove('active');
        }
    </script>
</body>
</html>
