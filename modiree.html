<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت</title>

  <!-- فایل تنظیمات اصلی -->
  <script src="./config.js"></script>

  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --danger: #e74c3c;
      --success: #27ae60;
      --text: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding-bottom: 70px; }

    /* هدر */
    header {
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-btn {
      padding: 6px 12px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 12px; font-weight: bold;
    }
    .logout-btn { background: var(--danger); color: #fff; }
    .info-btn { background: var(--primary); color: #fff; }
    .add-btn { background: var(--success); color: #fff; font-size: 16px; border-radius: 50%; width: 35px; height: 35px; }

    /* لیست محصولات در پنل مدیر */
    .products-list {
      padding: 15px; max-width: 800px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    .admin-prod-card {
      background: var(--card-bg); border-radius: 8px; padding: 10px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .admin-prod-card img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
    .admin-prod-info { flex-grow: 1; margin: 0 10px; font-size: 12px; }
    .admin-prod-actions { display: flex; gap: 5px; }
    .act-btn { padding: 4px 8px; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; color: #fff; }
    .edit-btn { background: #f39c12; }
    .del-btn { background: var(--danger); }

    /* منوی شناور پایین */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card-bg); padding: 10px 15px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1); z-index: 99;
    }
    .bar-btn {
      padding: 8px 12px; border: none; border-radius: 6px;
      font-size: 11px; font-weight: bold; cursor: pointer; color: #fff;
    }
    .pub-btn { background: #8e44ad; }
    .user-btn { background: #2980b9; }
    .msg-btn { background: #d35400; }

    /* پاپ‌آپ‌ها */
    .modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center; z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #fff; width: 90%; max-width: 400px;
      border-radius: 12px; padding: 18px; text-align: center;
      max-height: 85vh; overflow-y: auto;
    }
    .modal-content h3 { margin-bottom: 12px; font-size: 15px; }
    .modal-content input, .modal-content textarea {
      width: 100%; padding: 8px; margin: 5px 0;
      border: 1px solid #ccc; border-radius: 6px; font-size: 12px;
    }
    .modal-content textarea { height: 70px; resize: none; }
    .modal-btn {
      width: 100%; padding: 9px; margin-top: 8px;
      background: var(--primary); color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .close-btn { background: #7f8c8d; margin-top: 5px; }

    .item-row {
      background: #f8f9fa; border: 1px solid #eee; padding: 8px;
      border-radius: 6px; margin: 5px 0; text-align: right; font-size: 12px;
      cursor: pointer;
    }
    .msg-box {
      border: 1px solid #eee; padding: 8px; border-radius: 6px;
      max-height: 180px; overflow-y: auto; text-align: right; margin: 8px 0;
    }
    .msg-item { margin: 5px 0; padding: 5px; border-bottom: 1px dashed #ddd; font-size: 12px; }
  </style>
</head>
<body>

  <!-- هدر مدیر -->
  <header>
    <button class="top-btn logout-btn" onclick="handleAdminLogout()">خروج</button>
    <button class="top-btn info-btn" onclick="openModal('adminInfoModal')">اطلاعات مدیر</button>
    <button class="top-btn add-btn" onclick="openAddProductModal()">+</button>
  </header>

  <!-- لیست محصولات برای مدیریت -->
  <div class="products-list" id="adminProductsList">در حال بارگذاری محصولات...</div>

  <!-- نوار پایین -->
  <div class="bottom-bar">
    <button class="bar-btn pub-btn" onclick="openModal('pubNotifModal')">ارسال اعلان عمومی</button>
    <button class="bar-btn msg-btn" onclick="openUserMessagesModal()">پیام کاربران</button>
    <button class="bar-btn user-btn" onclick="openUsersModal()">کاربران</button>
  </div>

  <!-- پاپ‌آپ تغییر اطلاعات مدیر -->
  <div class="modal" id="adminInfoModal">
    <div class="modal-content">
      <h3>تغییر اطلاعات مدیر</h3>
      <input type="text" id="newAdminUser" placeholder="نام کاربری جدید مدیر">
      <input type="password" id="newAdminPass" placeholder="رمز عبور جدید مدیر">
      <button class="modal-btn" onclick="saveAdminInfo()">ذخیره تغییرات</button>
      <button class="modal-btn close-btn" onclick="closeModal('adminInfoModal')">انصراف</button>
    </div>
  </div>

  <!-- پاپ‌آپ افزودن / ویرایش محصول -->
  <div class="modal" id="productFormModal">
    <div class="modal-content">
      <h3 id="prodModalTitle">افزودن محصول</h3>
      <label style="font-size:11px; display:block; text-align:right;">عکس اصلی محصول:</label>
      <input type="file" id="prodMainImg" accept="image/*">
      <input type="number" id="prodPrice" placeholder="قیمت محصول (تومان)">
      
      <label style="font-size:11px; display:block; text-align:right; margin-top:5px;">عکس‌های اضافی:</label>
      <input type="file" id="prodExtraImgs" accept="image/*" multiple>
      
      <textarea id="prodDesc" placeholder="توضیحات اضافی"></textarea>
      <input type="text" id="prodCardNum" placeholder="شماره کارت">
      <input type="text" id="prodCardName" placeholder="نام صاحب کارت">
      <input type="text" id="prodRubika" placeholder="آیدی روبیکای صاحب محصول">
      
      <button class="modal-btn" id="saveProdBtn" onclick="saveProduct()">ثبت محصول</button>
      <button class="modal-btn close-btn" onclick="closeModal('productFormModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ ارسال اعلان عمومی -->
  <div class="modal" id="pubNotifModal">
    <div class="modal-content">
      <h3>ارسال اعلان عمومی</h3>
      <textarea id="pubNotifText" placeholder="متن اعلان عمومی را بنویسید..."></textarea>
      <button class="modal-btn" style="background:#8e44ad;" onclick="sendPublicNotif()">ارسال عمومی</button>
      <button class="modal-btn close-btn" onclick="closeModal('pubNotifModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ لیست کاربران -->
  <div class="modal" id="usersListModal">
    <div class="modal-content">
      <h3>لیست کاربران</h3>
      <div id="usersListContainer"></div>
      <button class="modal-btn close-btn" onclick="closeModal('usersListModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ ارسال اعلان شخصی -->
  <div class="modal" id="personalNotifModal">
    <div class="modal-content">
      <h3 id="personalNotifTitle">ارسال اعلان شخصی</h3>
      <textarea id="personalNotifText" placeholder="متن اعلان شخصی..."></textarea>
      <button class="modal-btn" onclick="sendPersonalNotif()">ارسال به کاربر</button>
      <button class="modal-btn close-btn" onclick="closeModal('personalNotifModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ لیست کاربران پیام‌دهنده -->
  <div class="modal" id="userMsgsListModal">
    <div class="modal-content">
      <h3>پیام کاربران</h3>
      <div id="userMsgsContainer"></div>
      <button class="modal-btn close-btn" onclick="closeModal('userMsgsListModal')">بستن</button>
    </div>
  </div>

  <!-- پاپ‌آپ گفتگو با کاربر -->
  <div class="modal" id="chatModal">
    <div class="modal-content">
      <h3 id="chatTitle">گفتگو</h3>
      <div class="msg-box" id="chatHistory"></div>
      <textarea id="replyText" placeholder="متن پاسخ..."></textarea>
      <input type="file" id="replyImg" accept="image/*">
      <button class="modal-btn" id="replyBtn" onclick="sendReply()">ارسال پاسخ</button>
      <button class="modal-btn close-btn" onclick="closeChatModal()">بستن</button>
    </div>
  </div>

  <script>
    let currentEditProdId = null;
    let selectedUserForNotif = null;
    let selectedUserForChat = null;
    let chatInterval = null;

    window.onload = function() {
      if (localStorage.getItem('adminAuth') !== 'true') {
        window.location.href = 'index.html';
        return;
      }
      preventBack();
      loadAdminProducts();
    };

    function preventBack() {
      history.pushState(null, null, location.href);
      window.onpopstate = function () { history.go(1); };
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function handleAdminLogout() {
      localStorage.removeItem('adminAuth');
      window.location.href = 'index.html';
    }

    // ذخیره اطلاعات جدید مدیر
    async function saveAdminInfo() {
      const username = document.getElementById('newAdminUser').value.trim();
      const password = document.getElementById('newAdminPass').value.trim();
      if (!username || !password) return alert("لطفاً همه فیلدها را پر کنید.");

      const res = await DB.set('admin', { username, password });
      if (res) {
        alert("اطلاعات مدیر با موفقیت به‌روزرسانی شد.");
        closeModal('adminInfoModal');
      } else {
        alert("خطا در به روزرسانی اطلاعات مدیر.");
      }
    }

    function openAddProductModal() {
      currentEditProdId = null;
      document.getElementById('prodModalTitle').innerText = "افزودن محصول";
      document.getElementById('prodPrice').value = "";
      document.getElementById('prodDesc').value = "";
      document.getElementById('prodCardNum').value = "";
      document.getElementById('prodCardName').value = "";
      document.getElementById('prodRubika').value = "";
      document.getElementById('prodMainImg').value = "";
      document.getElementById('prodExtraImgs').value = "";
      openModal('productFormModal');
    }

    // بارگذاری لیست محصولات از طریق Vercel
    async function loadAdminProducts() {
      const list = document.getElementById('adminProductsList');
      const products = await DB.get('products');
      list.innerHTML = "";

      if (products) {
        Object.keys(products).forEach(key => {
          const p = products[key];
          p.id = key;
          const card = document.createElement('div');
          card.className = 'admin-prod-card';
          card.innerHTML = `
            <img src="${p.mainImg}">
            <div class="admin-prod-info">
              <b>${p.price} تومان</b>
              <p style="color:#777; font-size:10px;">${(p.desc || '').substring(0, 30)}...</p>
            </div>
            <div class="admin-prod-actions">
              <button class="act-btn edit-btn" onclick='editProduct(${JSON.stringify(p)})'>ویرایش</button>
              <button class="act-btn del-btn" onclick="deleteProduct('${p.id}')">حذف</button>
            </div>
          `;
          list.appendChild(card);
        });
      } else {
        list.innerHTML = "<p style='text-align:center;'>محصولی وجود ندارد.</p>";
      }
    }

    // ثبت یا ویرایش محصول
    async function saveProduct() {
      const saveBtn = document.getElementById('saveProdBtn');
      const price = document.getElementById('prodPrice').value.trim();
      const desc = document.getElementById('prodDesc').value.trim();
      const cardNum = document.getElementById('prodCardNum').value.trim();
      const cardName = document.getElementById('prodCardName').value.trim();
      const rubika = document.getElementById('prodRubika').value.trim();

      const mainImgFile = document.getElementById('prodMainImg').files[0];
      const extraImgFiles = document.getElementById('prodExtraImgs').files;

      if (!price) return alert("لطفاً قیمت محصول را وارد کنید.");

      saveBtn.innerText = "در حال آپلود و ثبت...";
      saveBtn.disabled = true;

      try {
        let mainImgUrl = "";
        if (mainImgFile) {
          mainImgUrl = await uploadToImgBB(mainImgFile);
        }

        let extraImgUrls = [];
        for (let i = 0; i < extraImgFiles.length; i++) {
          const url = await uploadToImgBB(extraImgFiles[i]);
          if (url) extraImgUrls.push(url);
        }

        let productData = { price, desc, cardNum, cardName, rubika };

        if (currentEditProdId) {
          const oldData = await DB.get(`products/${currentEditProdId}`);
          productData.mainImg = mainImgUrl || oldData.mainImg;
          productData.extraImgs = extraImgUrls.length > 0 ? extraImgUrls : (oldData.extraImgs || []);
          await DB.set(`products/${currentEditProdId}`, productData);
        } else {
          if (!mainImgUrl) {
            alert("انتخاب عکس اصلی برای محصول جدید الزامی است.");
            saveBtn.innerText = "ثبت محصول";
            saveBtn.disabled = false;
            return;
          }
          productData.mainImg = mainImgUrl;
          productData.extraImgs = extraImgUrls;
          await DB.push('products', productData);
        }

        saveBtn.innerText = "ثبت محصول";
        saveBtn.disabled = false;
        closeModal('productFormModal');
        alert("محصول با موفقیت ثبت/ویرایش شد.");
        loadAdminProducts();

      } catch (e) {
        alert("خطایی رخ داد.");
        saveBtn.innerText = "ثبت محصول";
        saveBtn.disabled = false;
      }
    }

    function editProduct(p) {
      currentEditProdId = p.id;
      document.getElementById('prodModalTitle').innerText = "ویرایش محصول";
      document.getElementById('prodPrice').value = p.price || "";
      document.getElementById('prodDesc').value = p.desc || "";
      document.getElementById('prodCardNum').value = p.cardNum || "";
      document.getElementById('prodCardName').value = p.cardName || "";
      document.getElementById('prodRubika').value = p.rubika || "";
      openModal('productFormModal');
    }

    async function deleteProduct(id) {
      if (confirm("آیا از حذف این محصول اطمینان دارید؟")) {
        await DB.set(`products/${id}`, null);
        loadAdminProducts();
      }
    }

    // ارسال اعلان عمومی
    async function sendPublicNotif() {
      const text = document.getElementById('pubNotifText').value.trim();
      if (!text) return alert("متن اعلان را وارد کنید.");

      const res = await DB.push('notifications', {
        type: 'public',
        text: text,
        date: Date.now()
      });

      if (res) {
        alert("اعلان عمومی ارسال شد.");
        document.getElementById('pubNotifText').value = "";
        closeModal('pubNotifModal');
      }
    }

    // لیست کاربران
    async function openUsersModal() {
      const container = document.getElementById('usersListContainer');
      container.innerHTML = "در حال بارگذاری...";
      openModal('usersListModal');

      const users = await DB.get('users');
      container.innerHTML = "";

      if (users) {
        Object.keys(users).forEach(key => {
          const u = users[key];
          const div = document.createElement('div');
          div.className = 'item-row';
          div.innerHTML = `<b>نام:</b> ${u.name} | <b>یوزر:</b> ${u.username} | <b>رمز:</b> ${u.password}`;
          div.onclick = () => {
            selectedUserForNotif = u.username;
            closeModal('usersListModal');
            document.getElementById('personalNotifTitle').innerText = `ارسال اعلان به ${u.name}`;
            openModal('personalNotifModal');
          };
          container.appendChild(div);
        });
      } else {
        container.innerHTML = "هیچ کاربری یافت نشد.";
      }
    }

    // ارسال اعلان شخصی
    async function sendPersonalNotif() {
      const text = document.getElementById('personalNotifText').value.trim();
      if (!text || !selectedUserForNotif) return alert("متن را وارد کنید.");

      const res = await DB.push('notifications', {
        type: 'personal',
        targetUser: selectedUserForNotif,
        text: text,
        date: Date.now()
      });

      if (res) {
        alert("اعلان شخصی ارسال شد.");
        document.getElementById('personalNotifText').value = "";
        closeModal('personalNotifModal');
      }
    }

    // لیست پیام کاربران
    async function openUserMessagesModal() {
      const container = document.getElementById('userMsgsContainer');
      container.innerHTML = "در حال بارگذاری...";
      openModal('userMsgsListModal');

      const messages = await DB.get('messages');
      container.innerHTML = "";

      if (messages) {
        const usersWithMsgs = new Set();
        Object.keys(messages).forEach(key => {
          const m = messages[key];
          if (m.sender && m.sender !== 'admin') usersWithMsgs.add(m.sender);
        });

        usersWithMsgs.forEach(username => {
          const div = document.createElement('div');
          div.className = 'item-row';
          div.innerText = `گفتگو با کاربر: ${username}`;
          div.onclick = () => openChatWithUser(username);
          container.appendChild(div);
        });
      }

      if (!container.innerHTML) container.innerHTML = "پیامی دریافت نشده است.";
    }

    function openChatWithUser(username) {
      selectedUserForChat = username;
      closeModal('userMsgsListModal');
      document.getElementById('chatTitle').innerText = `گفتگو با ${username}`;
      openModal('chatModal');

      loadChatHistory();
      chatInterval = setInterval(loadChatHistory, 3000);
    }

    function closeChatModal() {
      if (chatInterval) clearInterval(chatInterval);
      closeModal('chatModal');
    }

    async function loadChatHistory() {
      if (!selectedUserForChat) return;
      const messages = await DB.get('messages');
      const box = document.getElementById('chatHistory');
      
      if (!messages) {
        box.innerHTML = "پیامی یافت نشد.";
        return;
      }

      const isScrolledToBottom = box.scrollHeight - box.clientHeight <= box.scrollTop + 50;
      box.innerHTML = "";

      Object.keys(messages).forEach(key => {
        const m = messages[key];
        if (m.sender === selectedUserForChat || m.receiver === selectedUserForChat) {
          const div = document.createElement('div');
          div.className = 'msg-item';
          div.style.textAlign = m.sender === 'admin' ? 'left' : 'right';
          let content = `<b>${m.sender}:</b> ${m.text || ''}`;
          if (m.imgUrl) {
            content += `<br><img src="${m.imgUrl}" style="max-width:100px; border-radius:4px; margin-top:4px;">`;
          }
          div.innerHTML = content;
          box.appendChild(div);
        }
      });

      if (isScrolledToBottom) {
        box.scrollTop = box.scrollHeight;
      }
    }

    // پاسخ مدیر به کاربر
    async function sendReply() {
      const text = document.getElementById('replyText').value.trim();
      const imgFile = document.getElementById('replyImg').files[0];
      const replyBtn = document.getElementById('replyBtn');

      if (!text && !imgFile) return alert("متن یا عکس وارد کنید.");

      replyBtn.innerText = "در حال ارسال...";
      replyBtn.disabled = true;

      try {
        let imgUrl = "";
        if (imgFile) {
          imgUrl = await uploadToImgBB(imgFile);
        }

        await DB.push('messages', {
          sender: 'admin',
          receiver: selectedUserForChat,
          text: text,
          imgUrl: imgUrl || "",
          date: Date.now()
        });

        document.getElementById('replyText').value = "";
        document.getElementById('replyImg').value = "";
        replyBtn.innerText = "ارسال پاسخ";
        replyBtn.disabled = false;

        await loadChatHistory();
        const box = document.getElementById('chatHistory');
        box.scrollTop = box.scrollHeight;

      } catch (e) {
        replyBtn.innerText = "ارسال پاسخ";
        replyBtn.disabled = false;
        alert("خطا در ارسال پاسخ.");
      }
    }
  </script>
</body>
</html>
