<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پشتیبانی</title>

  <!-- فایل تنظیمات اصلی -->
  <script src="./config.js"></script>

  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --danger: #e74c3c;
      --success: #27ae60;
      --text: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding-bottom: 20px; }

    /* هدر */
    header {
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-btn {
      background: #7f8c8d; color: #fff; border: none;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: bold;
    }

    /* کادر گفتگو */
    .chat-container {
      max-width: 600px; margin: 15px auto;
      background: var(--card-bg); border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05); padding: 15px;
      display: flex; flex-direction: column; height: calc(100vh - 100px);
    }
    .messages-list {
      flex-grow: 1; overflow-y: auto; padding: 10px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg-bubble {
      max-width: 80%; padding: 10px; border-radius: 10px;
      font-size: 13px; line-height: 1.5; word-wrap: break-word;
    }
    .user-msg {
      align-self: flex-start; background: #e3f2fd;
      border-bottom-right-radius: 2px; text-align: right;
    }
    .admin-msg {
      align-self: flex-end; background: #f1f8e9;
      border-bottom-left-radius: 2px; text-align: right;
    }
    .msg-img {
      max-width: 100%; max-height: 180px; border-radius: 8px;
      margin-top: 6px; display: block; object-fit: cover;
    }
    .dl-btn {
      display: inline-block; background: var(--primary); color: #fff;
      padding: 4px 8px; border-radius: 4px; text-decoration: none;
      font-size: 11px; margin-top: 5px; font-weight: bold;
    }

    /* فرم ارسال پیام */
    .input-area {
      display: flex; flex-direction: column; gap: 8px;
      border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px;
    }
    .input-area textarea {
      width: 100%; height: 60px; padding: 8px;
      border: 1px solid #ccc; border-radius: 6px;
      font-size: 12px; resize: none;
    }
    .actions-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .file-input { font-size: 11px; }
    .send-btn {
      background: var(--success); color: #fff; border: none;
      padding: 8px 16px; border-radius: 6px; cursor: pointer;
      font-weight: bold; font-size: 12px; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- هدر -->
  <header>
    <button class="back-btn" onclick="window.location.href='index.html'">بازگشت</button>
    <div style="font-weight: bold; font-size: 14px;">پشتیبانی و ارتباط با مدیر</div>
    <div style="width: 50px;"></div>
  </header>

  <!-- محیط چت -->
  <div class="chat-container">
    <div class="messages-list" id="messagesList">در حال بارگذاری پیام‌ها...</div>

    <div class="input-area">
      <textarea id="msgText" placeholder="پیام خود را بنویسید..."></textarea>
      <div class="actions-row">
        <input type="file" id="msgImg" accept="image/*" class="file-input">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">ارسال</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('user')) || null;

    window.onload = function() {
      if (!currentUser) {
        alert("لطفاً ابتدا ثبت‌نام کنید یا وارد شوید.");
        window.location.href = 'index.html';
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('ref') === 'receipt') {
        document.getElementById('msgText').value = "سلام، رسید پرداخت خدمت شما ارسال شد:";
      }

      loadMessages();
      // بروزرسانی خودکار پیام‌ها هر ۳ ثانیه یک‌بار
      setInterval(loadMessages, 3000);
    };

    // بارگذاری پیام‌ها از طریق API Vercel
    async function loadMessages() {
      const messagesData = await DB.get('messages');
      const list = document.getElementById('messagesList');
      
      if (!messagesData) {
        list.innerHTML = "<p style='text-align:center;'>هنوز پیامی ارسال نشده است.</p>";
        return;
      }

      const isScrolledToBottom = list.scrollHeight - list.clientHeight <= list.scrollTop + 50;

      list.innerHTML = "";

      Object.keys(messagesData).forEach(key => {
        const m = messagesData[key];
        if (m.sender === currentUser.username || m.receiver === currentUser.username) {
          const isMe = m.sender === currentUser.username;
          const bubble = document.createElement('div');
          bubble.className = `msg-bubble ${isMe ? 'user-msg' : 'admin-msg'}`;

          let htmlContent = `<b>${isMe ? 'شما' : 'مدیر'}:</b><br>${m.text || ''}`;
          
          if (m.imgUrl) {
            htmlContent += `
              <br>
              <img src="${m.imgUrl}" class="msg-img">
              <a href="${m.imgUrl}" target="_blank" download class="dl-btn">دانلود عکس ⬇</a>
            `;
          }

          bubble.innerHTML = htmlContent;
          list.appendChild(bubble);
        }
      });

      if (isScrolledToBottom) {
        list.scrollTop = list.scrollHeight;
      }
    }

    // ارسال پیام جدید به مدیر
    async function sendMessage() {
      const text = document.getElementById('msgText').value.trim();
      const imgFile = document.getElementById('msgImg').files[0];
      const sendBtn = document.getElementById('sendBtn');

      if (!text && !imgFile) {
        return alert("لطفاً متن پیام یا عکس را انتخاب کنید.");
      }

      sendBtn.innerText = "در حال ارسال...";
      sendBtn.disabled = true;

      try {
        let imgUrl = "";
        if (imgFile) {
          imgUrl = await uploadToImgBB(imgFile);
        }

        const msgData = {
          sender: currentUser.username,
          receiver: 'admin',
          text: text,
          imgUrl: imgUrl || "",
          date: Date.now()
        };

        const result = await DB.push('messages', msgData);

        sendBtn.innerText = "ارسال";
        sendBtn.disabled = false;

        if (result) {
          document.getElementById('msgText').value = "";
          document.getElementById('msgImg').value = "";
          await loadMessages();
          const list = document.getElementById('messagesList');
          list.scrollTop = list.scrollHeight;
        } else {
          alert("خطا در ارسال پیام.");
        }

      } catch (e) {
        sendBtn.innerText = "ارسال";
        sendBtn.disabled = false;
        alert("خطا در آپلود عکس یا ارسال پیام.");
      }
    }
  </script>
</body>
</html>
